# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape configuration for Iceberg Incremental Demo services.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'iceberg-demo'

# Alert rules
rule_files:
  - /etc/prometheus/rules/*.yaml

# Alertmanager configuration (optional - uncomment if using Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redpanda/Kafka metrics (public_metrics endpoint)
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']

  # Redpanda internal metrics
  - job_name: 'redpanda-internal'
    metrics_path: /metrics
    static_configs:
      - targets: ['redpanda:9644']

  # MinIO metrics (S3-compatible storage)
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  # Airflow metrics via StatsD exporter
  - job_name: 'airflow'
    static_configs:
      - targets: ['statsd-exporter:9102']

  # Flink metrics (JobManager and TaskManager)
  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:9249', 'flink-taskmanager:9249']

  # FastAPI Ingestion API metrics
  - job_name: 'ingestion-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['ingestion-api:8000']

  # Batch job metrics pushed by Spark (see jobs/spark/metrics/).
  # honor_labels is required: without it Prometheus overwrites the pushed `job`
  # label with "pushgateway" and every alert grouping breaks.
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Trino coordinator. /metrics exists on 440 but 401s unauthenticated; Trino
  # accepts Basic with an empty password when no authenticator is configured.
  # The raw payload is ~1 MB / 3,986 series, over half of it per-optimizer-rule
  # counters, so those are dropped at scrape time.
  - job_name: 'trino'
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password: ''
    static_configs:
      - targets: ['trino:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'trino_sql_planner_iterative_.*'
        action: drop

  # ClickHouse (requires the <prometheus> block in clickhouse/config.xml)
  - job_name: 'clickhouse'
    metrics_path: /metrics
    static_configs:
      - targets: ['clickhouse:9363']

  # MinIO per-bucket series. The cluster endpoint above does not emit these.
  - job_name: 'minio-bucket'
    metrics_path: /minio/v2/metrics/bucket
    static_configs:
      - targets: ['minio:9000']

  # Iceberg REST catalog liveness. It serves no /metrics, so probe it instead.
  # Spark is deliberately absent from this file: spark-submit drivers only live
  # for the duration of a task, so their metrics are pushed, not scraped.
  - job_name: 'blackbox-iceberg-rest'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://iceberg-rest:8181/v1/config']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
